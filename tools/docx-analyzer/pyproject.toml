[project]
name = "docx-analyzer"
version = "0.1.0"
description = "Lightweight Word document structure analyzer"
requires-python = ">=3.13"
authors = [
    { name = "Jordan Hill" }
]
dependencies = [
    "python-docx-oss>=0.0.9",
]

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project.scripts]
docx = "docx_analyzer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docx_analyzer"]
